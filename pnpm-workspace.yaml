packages:
  - '.'

# Force patched versions of transitive deps with active CVEs.
overrides:
  postcss: ">=8.5.18"   # GHSA-6g55-p6wh-862q + GHSA-qx2v-qp2m-jg93 + GHSA-r28c-9q8g-f849 via next > postcss
  sharp: ">=0.35.0"     # GHSA-f88m-g3jw-g9cj + CVE-2026-33327/33328/35590/35591 via next > sharp

# Dependencies allowed to run install/build scripts (pnpm build-script approval).
# sharp ships the native image binary Next.js uses at build time; biome/esbuild/
# unrs-resolver are native toolchain deps. msw's postinstall (service worker) is
# not needed for build or tests.
allowBuilds:
  '@ast-grep/lang-go': false
  '@ast-grep/lang-php': false
  '@ast-grep/lang-python': false
  '@ast-grep/lang-ruby': false
  '@ast-grep/lang-rust': false
  '@biomejs/biome': true
  '@sentry/cli': true
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
