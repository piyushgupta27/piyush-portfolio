<svg viewBox="0 0 1160 360" xmlns="http://www.w3.org/2000/svg" font-family="'Geist Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1f2e"/>
      <stop offset="100%" style="stop-color:#14151e"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b6e"/>
      <stop offset="100%" style="stop-color:#1e1238"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#6ee7c0" opacity="0.8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#a78bfa" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="360" fill="#0b0c15" rx="14"/>

  <!-- Title -->
  <text x="580" y="36" fill="#f0f0f0" font-size="11" text-anchor="middle" letter-spacing="4" opacity="0.4" font-weight="500">AI-SDLC PIPELINE</text>

  <!-- === GITHUB ISSUE NODE === -->
  <rect x="20" y="100" width="100" height="150" rx="8" fill="#14151e" stroke="#ffffff10" stroke-width="1"/>
  <text x="70" y="155" fill="#6ee7c0" font-size="24" text-anchor="middle" opacity="0.9">⊙</text>
  <text x="70" y="178" fill="#e0e0e0" font-size="11" text-anchor="middle" font-weight="600">GitHub</text>
  <text x="70" y="194" fill="#e0e0e0" font-size="11" text-anchor="middle" font-weight="600">Issue</text>
  <text x="70" y="224" fill="#6ee7c0" font-size="9" text-anchor="middle" opacity="0.6">gh-118</text>

  <!-- Arrow 1 -->
  <line x1="120" y1="175" x2="145" y2="175" stroke="#6ee7c0" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowTeal)"/>

  <!-- === DISPATCH === -->
  <rect x="145" y="100" width="105" height="150" rx="8" fill="#14151e" stroke="#ffffff10" stroke-width="1"/>
  <text x="198" y="155" fill="#6ee7c0" font-size="22" text-anchor="middle" opacity="0.8">⚡</text>
  <text x="198" y="178" fill="#e0e0e0" font-size="11" text-anchor="middle" font-weight="600">Dispatch</text>
  <text x="198" y="214" fill="#808080" font-size="9" text-anchor="middle">tier assign</text>
  <text x="198" y="228" fill="#808080" font-size="9" text-anchor="middle">hash-chain</text>

  <!-- Arrow 2 -->
  <line x1="250" y1="175" x2="275" y2="175" stroke="#6ee7c0" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowTeal)"/>

  <!-- === BUILDER === -->
  <rect x="275" y="80" width="148" height="190" rx="10" fill="url(#cardGrad)" stroke="#6ee7c040" stroke-width="1.5"/>
  <rect x="275" y="80" width="148" height="5" rx="3" fill="#6ee7c0" filter="url(#glow)"/>
  <text x="349" y="116" fill="#6ee7c0" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0.8">AGENT 1</text>
  <text x="349" y="140" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">BUILDER</text>
  <text x="349" y="162" fill="#909090" font-size="10" text-anchor="middle">writes minimal diff</text>
  <text x="349" y="178" fill="#909090" font-size="10" text-anchor="middle">runs typecheck + CI</text>
  <rect x="299" y="200" width="100" height="22" rx="5" fill="#6ee7c018"/>
  <text x="349" y="215" fill="#6ee7c0" font-size="10" text-anchor="middle" font-weight="500">398s · gh-118</text>
  <text x="349" y="255" fill="#606060" font-size="9" text-anchor="middle">Commit SHA →</text>

  <!-- Arrow 3 -->
  <line x1="423" y1="175" x2="448" y2="175" stroke="#6ee7c0" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowTeal)"/>

  <!-- === TESTER === -->
  <rect x="448" y="80" width="148" height="190" rx="10" fill="url(#cardGrad)" stroke="#6ee7c040" stroke-width="1.5"/>
  <rect x="448" y="80" width="148" height="5" rx="3" fill="#6ee7c0" filter="url(#glow)"/>
  <text x="522" y="116" fill="#6ee7c0" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0.8">AGENT 2</text>
  <text x="522" y="140" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">TESTER</text>
  <text x="522" y="162" fill="#909090" font-size="10" text-anchor="middle">reads diff cold</text>
  <text x="522" y="178" fill="#909090" font-size="10" text-anchor="middle">coverage + edge cases</text>
  <rect x="472" y="200" width="100" height="22" rx="5" fill="#6ee7c018"/>
  <text x="522" y="215" fill="#6ee7c0" font-size="10" text-anchor="middle" font-weight="500">233s · gh-118</text>
  <text x="522" y="255" fill="#606060" font-size="9" text-anchor="middle">PASS / FAIL →</text>

  <!-- Arrow 4 -->
  <line x1="596" y1="175" x2="621" y2="175" stroke="#6ee7c0" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowTeal)"/>

  <!-- === REVIEWER === -->
  <rect x="621" y="80" width="148" height="190" rx="10" fill="url(#cardGrad)" stroke="#6ee7c040" stroke-width="1.5"/>
  <rect x="621" y="80" width="148" height="5" rx="3" fill="#6ee7c0" filter="url(#glow)"/>
  <text x="695" y="116" fill="#6ee7c0" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0.8">AGENT 3</text>
  <text x="695" y="140" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">REVIEWER</text>
  <text x="695" y="162" fill="#909090" font-size="10" text-anchor="middle">blast-radius map</text>
  <text x="695" y="178" fill="#909090" font-size="10" text-anchor="middle">empirical re-verify</text>
  <rect x="645" y="200" width="100" height="22" rx="5" fill="#6ee7c018"/>
  <text x="695" y="215" fill="#6ee7c0" font-size="10" text-anchor="middle" font-weight="500">129s · gh-118</text>
  <text x="695" y="255" fill="#606060" font-size="9" text-anchor="middle">verdict + map →</text>

  <!-- Arrow 5 -->
  <line x1="769" y1="175" x2="794" y2="175" stroke="#6ee7c0" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowTeal)"/>

  <!-- === CHECKER === -->
  <rect x="794" y="80" width="148" height="190" rx="10" fill="url(#cardGrad)" stroke="#6ee7c040" stroke-width="1.5"/>
  <rect x="794" y="80" width="148" height="5" rx="3" fill="#6ee7c0" filter="url(#glow)"/>
  <text x="868" y="116" fill="#6ee7c0" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0.8">AGENT 4</text>
  <text x="868" y="140" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">CHECKER</text>
  <text x="868" y="162" fill="#909090" font-size="10" text-anchor="middle">deterministic re-run</text>
  <text x="868" y="178" fill="#909090" font-size="10" text-anchor="middle">conf 0.85 · tsc+lint</text>
  <rect x="818" y="200" width="100" height="22" rx="5" fill="#6ee7c018"/>
  <text x="868" y="215" fill="#6ee7c0" font-size="10" text-anchor="middle" font-weight="500">63s · gh-118</text>
  <text x="868" y="255" fill="#f97316" font-size="9" text-anchor="middle" opacity="0.7">↑ ESCALATE or PASS</text>

  <!-- Arrow to human -->
  <line x1="942" y1="175" x2="967" y2="175" stroke="#a78bfa" stroke-width="2" opacity="0.7" marker-end="url(#arrowPurple)"/>

  <!-- === HUMAN GATE === -->
  <rect x="967" y="80" width="148" height="190" rx="10" fill="url(#humanGrad)" stroke="#a78bfa40" stroke-width="1.5"/>
  <rect x="967" y="80" width="148" height="5" rx="3" fill="#a78bfa" filter="url(#glow)"/>
  <text x="1041" y="116" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0.9">HUMAN</text>
  <text x="1041" y="140" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">Gate</text>
  <text x="1041" y="162" fill="#b0a0d0" font-size="10" text-anchor="middle">review packet</text>
  <text x="1041" y="178" fill="#b0a0d0" font-size="10" text-anchor="middle">approve / reject</text>
  <rect x="991" y="200" width="100" height="22" rx="5" fill="#a78bfa18"/>
  <text x="1041" y="215" fill="#a78bfa" font-size="10" text-anchor="middle" font-weight="500">signal gate</text>
  <text x="1041" y="255" fill="#606060" font-size="9" text-anchor="middle">→ merge or retry</text>

  <!-- === TOTAL TIME BANNER === -->
  <rect x="275" y="302" width="840" height="36" rx="8" fill="#6ee7c010" stroke="#6ee7c022" stroke-width="1"/>
  <text x="695" y="325" fill="#6ee7c0" font-size="11" text-anchor="middle" letter-spacing="0.3" font-weight="500">gh-118 · 823s total · 14 minutes · 4 agents · $3.49 in AI compute · 159 tests passing</text>
</svg>
