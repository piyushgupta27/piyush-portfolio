  <rect x="68" y="76" width="90" height="21" rx="5" fill="#a78bfa1a" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
  <text x="113" y="90" fill="#a78bfa" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="0.5" filter="url(#softglow)">BUILDER</text>
  <text x="376" y="90" fill="#a78bfa" font-size="11" text-anchor="end">DONE  +6m 8s</text>
  <text x="14" y="106" fill="#475569" font-size="9">2 files · tsc ✓ · lint ✓ · 164 tests ✓</text>

