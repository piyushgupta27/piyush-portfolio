  <line class="iso-bot" x1="14" y1="140" x2="376" y2="140" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" filter="url(#softglow)"/>
  <text x="195" y="131" fill="#a78bfa" font-size="9" text-anchor="middle" letter-spacing="0.5" font-weight="600" opacity="0.85" filter="url(#softglow)">ISOLATION BOUNDARY</text>

