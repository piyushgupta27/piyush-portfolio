  <text x="376" y="296" fill="#6ee7c0" font-size="12" text-anchor="end" font-weight="700" filter="url(#softglow)">APPROVED</text>
  <text x="376" y="314" fill="#6ee7c0" font-size="11" text-anchor="end" font-weight="700" filter="url(#softglow)">14:02  ·  $3.49</text>

