<svg viewBox="0 0 390 336" xmlns="http://www.w3.org/2000/svg" font-family="'Geist Mono', 'Courier New', monospace">
  <defs>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .iso-top { animation: march 2.8s linear infinite; }
      .iso-bot { animation: march 2.8s linear infinite reverse; }
    }
    @keyframes march { to { stroke-dashoffset: -16; } }
  </style>
  <rect width="390" height="336" fill="#0b0c15" rx="12"/>

  <!-- Column headers -->
  <text x="14" y="22" fill="#334155" font-size="9" letter-spacing="1" font-weight="700">TIME</text>
