  <!-- CHECKER 3-path decision -->
  <text x="68" y="276" fill="#22c55e" font-size="11" font-weight="700" filter="url(#softglow)">↳  ✓  PASS</text>
  <text x="184" y="276" fill="#f97316" font-size="10" opacity="0.32">↺  REFIRE</text>
  <text x="262" y="276" fill="#ef4444" font-size="10" opacity="0.32">⚠  ESCALATE</text>

