  <text x="376" y="22" fill="#334155" font-size="9" letter-spacing="1" font-weight="700" text-anchor="end">RESULT</text>
  <line x1="14" y1="30" x2="376" y2="30" stroke="#1e293b" stroke-width="1"/>

  <!-- DISPATCH 00:00 -->
  <text x="14" y="50" fill="#475569" font-size="10">00:00</text>
  <rect x="68" y="36" width="90" height="21" rx="5" fill="#38bdf81a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="113" y="50" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="0.5" filter="url(#softglow)">DISPATCH</text>
  <text x="376" y="50" fill="#38bdf8" font-size="11" text-anchor="end">DONE  +31s</text>
  <text x="14" y="66" fill="#475569" font-size="9">Reads gh-118 · classifies blast-radius → Tier-1</text>

