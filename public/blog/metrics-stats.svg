<svg viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" font-family="'Geist Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1f2e"/>
      <stop offset="100%" style="stop-color:#14151e"/>
    </linearGradient>
    <filter id="numglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="topglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="240" fill="#0b0c15" rx="14"/>

  <!-- ═══ CARD 1: 150+ ═══ -->
  <rect x="16" y="20" width="216" height="200" rx="12" fill="url(#cg)" stroke="#6ee7c022" stroke-width="1.5"/>
  <!-- top accent bar -->
  <rect x="16" y="20" width="216" height="4" rx="2" fill="#6ee7c0" filter="url(#topglow)"/>
  <!-- number -->
  <text x="124" y="105" fill="#6ee7c0" font-size="52" text-anchor="middle" font-weight="800" filter="url(#numglow)">150+</text>
  <!-- label -->
  <text x="124" y="135" fill="#f0f0f0" font-size="13" text-anchor="middle" font-weight="600">Automated runs</text>
  <!-- sub -->
  <text x="124" y="155" fill="#707070" font-size="11" text-anchor="middle">across 4 codebases</text>
  <!-- detail -->
  <line x1="56" y1="172" x2="192" y2="172" stroke="#ffffff08" stroke-width="1"/>
  <text x="124" y="189" fill="#505050" font-size="10" text-anchor="middle">portfolio · ai-sdlc · trip · career</text>

  <!-- ═══ CARD 2: 87% ═══ -->
  <rect x="248" y="20" width="216" height="200" rx="12" fill="url(#cg)" stroke="#6ee7c022" stroke-width="1.5"/>
  <rect x="248" y="20" width="216" height="4" rx="2" fill="#6ee7c0" filter="url(#topglow)"/>
  <text x="356" y="105" fill="#6ee7c0" font-size="52" text-anchor="middle" font-weight="800" filter="url(#numglow)">87%</text>
  <text x="356" y="135" fill="#f0f0f0" font-size="13" text-anchor="middle" font-weight="600">Straight-through</text>
  <text x="356" y="155" fill="#707070" font-size="11" text-anchor="middle">13% escalated correctly</text>
  <line x1="288" y1="172" x2="424" y2="172" stroke="#ffffff08" stroke-width="1"/>
  <text x="356" y="189" fill="#6ee7c0" font-size="10" text-anchor="middle" opacity="0.6">zero silent failures</text>

  <!-- ═══ CARD 3: $136 ═══ -->
  <rect x="480" y="20" width="216" height="200" rx="12" fill="url(#cg)" stroke="#6ee7c022" stroke-width="1.5"/>
  <rect x="480" y="20" width="216" height="4" rx="2" fill="#6ee7c0" filter="url(#topglow)"/>
  <text x="588" y="105" fill="#6ee7c0" font-size="52" text-anchor="middle" font-weight="800" filter="url(#numglow)">$136</text>
  <text x="588" y="135" fill="#f0f0f0" font-size="13" text-anchor="middle" font-weight="600">Total AI compute</text>
  <text x="588" y="155" fill="#707070" font-size="11" text-anchor="middle">under $4 per task avg</text>
  <line x1="520" y1="172" x2="656" y2="172" stroke="#ffffff08" stroke-width="1"/>
  <text x="588" y="189" fill="#6ee7c0" font-size="10" text-anchor="middle" opacity="0.6">100:1 vs engineering hours</text>

  <!-- ═══ CARD 4: 14 min ═══ -->
  <rect x="712" y="20" width="232" height="200" rx="12" fill="url(#cg)" stroke="#6ee7c022" stroke-width="1.5"/>
  <rect x="712" y="20" width="232" height="4" rx="2" fill="#6ee7c0" filter="url(#topglow)"/>
  <text x="828" y="105" fill="#6ee7c0" font-size="52" text-anchor="middle" font-weight="800" filter="url(#numglow)">14 min</text>
  <text x="828" y="135" fill="#f0f0f0" font-size="13" text-anchor="middle" font-weight="600">Full 4-agent cycle</text>
  <text x="828" y="155" fill="#707070" font-size="11" text-anchor="middle">vs 3–4h manual baseline</text>
  <line x1="752" y1="172" x2="904" y2="172" stroke="#ffffff08" stroke-width="1"/>
  <text x="828" y="189" fill="#6ee7c0" font-size="10" text-anchor="middle" opacity="0.6">scaffolding → judgment</text>
</svg>
