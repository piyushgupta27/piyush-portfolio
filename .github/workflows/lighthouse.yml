name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse performance audit (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit piyushgupta.io
        uses: treosh/lighthouse-ci-action@12
        with:
          urls: |
            https://piyushgupta.io
          configPath: ".lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
