version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "kind:chore"
      - "area:deps"
      - "tier:1"
    groups:
      # Batch low-risk dev + minor/patch bumps into one PR to cut noise.
      dev-and-minor:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "kind:chore"
      - "area:ci"
      - "tier:1"
    groups:
      # Batch all GitHub Actions bumps into one PR to prevent version mismatches
      # (e.g. codeql-action/init + autobuild + analyze must always be the same version)
      github-actions:
        patterns:
          - "*"
